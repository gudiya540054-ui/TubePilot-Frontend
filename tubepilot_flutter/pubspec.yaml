name: tubepilot_flutter
description: "TubePilot - YouTube Auto Uploader & Scheduler"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Networking
  http: ^1.2.1

  # Local persistence (theme preference, tokens)
  shared_preferences: ^2.2.3

  # Auth
  google_sign_in: ^6.2.1
  url_launcher: ^6.3.0
  app_links: ^6.3.2

  # Push notifications (real phone notifications via Firebase Cloud Messaging)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # File pickers (thumbnail, video, and screenshot) - image_picker handles both
  # images and video, so we don't need the separate file_picker package
  # (which has a known Android build issue: "cannot find symbol FilePickerPlugin").
  image_picker: ^1.1.2

  # Video preview
  video_player: ^2.9.1

  # Nice date/time formatting & pickers
  intl: ^0.19.0

  # Charts for analytics
  fl_chart: ^0.68.0

  # Pull to refresh
  cached_network_image: ^3.3.1

  # Video/image content-type detection for uploads (fixes "wrong file type"
  # rejections — the http package does NOT auto-detect mime types otherwise)
  mime: ^2.0.0

  # Sharing the referral code via the native share sheet
  share_plus: ^13.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
